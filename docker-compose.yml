services:
  database:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: tetrascience, POSTGRES_USER: tetrascience, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}" }
    volumes: [tetrascience-data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL","pg_isready -U tetrascience"], interval: 5s, timeout: 3s, retries: 20 }
  migrate:
    build: ./backend
    environment: { DATABASE_URL: "postgresql://tetrascience:${POSTGRES_PASSWORD}@database:5432/tetrascience" }
    command: ["node","scripts/migrate.js","up"]
    depends_on: { database: { condition: service_healthy } }
  api:
    build: ./backend
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://tetrascience:${POSTGRES_PASSWORD}@database:5432/tetrascience"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET required}"
      CORS_ORIGINS: "${CORS_ORIGINS:?CORS_ORIGINS required}"
      ENABLE_AI: "false"
      ENABLE_DEMO_ROUTES: "false"
    read_only: true
    tmpfs: [/tmp]
    depends_on: { migrate: { condition: service_completed_successfully } }
  ui:
    build: ./frontend
    ports: ["3001:8080"]
    depends_on: [api]
volumes: { tetrascience-data: {} }
